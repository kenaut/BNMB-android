name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "发布版本号（仅用于产物命名，不修改工程内的 versionName）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  # 发布 Release 与上传附件需要写权限
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        # 运行器已预装 Android SDK，无需再装已下架的 "tools" 包，只需接受许可
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager，请检查运行器环境"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BNMB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.BNMB_KEYSTORE_BASE64，无法生成正式签名 APK"
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/bnmb-release.jks

      - name: Build release APK
        env:
          BNMB_KEYSTORE_PATH: keystore/bnmb-release.jks
          BNMB_KEYSTORE_PASSWORD: ${{ secrets.BNMB_KEYSTORE_PASSWORD }}
          BNMB_KEY_ALIAS: ${{ secrets.BNMB_KEY_ALIAS }}
          BNMB_KEY_PASSWORD: ${{ secrets.BNMB_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          BUILD_TOOLS=$(dirname "$APKSIGNER")
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^package:"

      - name: Package artifacts
        run: |
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION_CODE=$("$BUILT/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          MIN_SDK=$("$BUILT/aapt" dump badging "$APK" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p")

          mkdir -p dist
          APK_NAME="BNMB_android-v${VERSION}.apk"
          cp "$APK" "dist/$APK_NAME"

          SHA256=$(sha256sum "dist/$APK_NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "dist/$APK_NAME")
          cat > dist/latest.json <<JSON
          {
            "versionName": "$VERSION",
            "versionCode": $VERSION_CODE,
            "minSdk": $MIN_SDK,
            "sha256": "$SHA256",
            "apk": "$APK_NAME",
            "size": $SIZE
          }
          JSON
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS)

          echo "版本 $VERSION / versionCode $VERSION_CODE / $SIZE 字节"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bnmb-release-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BNMB Android v${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: false
          generate_release_notes: true

      - name: Cleanup keystore
        if: always()
        run: rm -f android/keystore/bnmb-release.jks
